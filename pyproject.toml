[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-agent-langgraph"
version = "0.1.0"
description = "DevOps agent skeleton with LangGraph planner/critic/executor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langgraph>=0.2.0",
  "kubernetes>=29.0.0",
  "paramiko>=3.4.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "langchain-openai",
  "guardrails-ai>=0.5.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
]
guardrails = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "detect-secrets>=1.4.0",
  "spacy>=3.7.0",
]
all = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "detect-secrets>=1.4.0",
  "spacy>=3.7.0",
  "pytest>=8.2.0",
]

[project.scripts]
promptops = "devops_agent.promptops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external systems like SMB share and Kubernetes cluster",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-8s %(name)s:%(lineno)d  %(message)s"
log_cli_date_format = "%H:%M:%S"
log_file = "logs/pytest.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s %(levelname)-8s %(name)s:%(lineno)d  %(message)s"