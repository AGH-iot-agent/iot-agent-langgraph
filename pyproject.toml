[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-agent-langgraph"
version = "0.1.0"
description = "DevOps agent skeleton with LangGraph planner/critic/executor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langgraph>=0.2.0",
  "kubernetes>=29.0.0",
  "paramiko>=3.4.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "langchain-openai"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]