name: LangGraph Agent CI

on:
  push:
    branches: [ main, feat/IOOAG-01-langgraph ]
    paths:
      - 'iot-agent-langgraph/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, feat/IOOAG-01-langgraph ]
    paths:
      - 'iot-agent-langgraph/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      LANGGRAPH_IMAGE: iot-agent-langgraph:${{ github.sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LangGraph image
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx version >/dev/null 2>&1; then
            docker build -f iot-agent-langgraph/Dockerfile -t "$LANGGRAPH_IMAGE" iot-agent-langgraph
          else
            DOCKER_BUILDKIT=0 docker build -f iot-agent-langgraph/Dockerfile -t "$LANGGRAPH_IMAGE" iot-agent-langgraph
          fi

      - name: Start LangGraph service
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name iot-agent-langgraph \
            -p 8123:8123 \
            -e OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            "$LANGGRAPH_IMAGE"

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:8123/health >/dev/null; then
              echo "LangGraph is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "LangGraph did not become healthy in time"
          exit 1

      - name: Container logs on failure
        if: failure()
        shell: bash
        run: docker logs iot-agent-langgraph

      - name: Cleanup
        if: always()
        shell: bash
        run: docker rm -f iot-agent-langgraph
